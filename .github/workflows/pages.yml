name: Publish Kodi repository
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: kodi-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_repository.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Checkout Kodi file source
        uses: actions/checkout@v4
        with:
          repository: anicat-org/anicat-org.github.io
          ref: main
          path: file-source
          ssh-key: ${{ secrets.KODI_FILE_SOURCE_DEPLOY_KEY }}
      - name: Update root file source
        run: |
          python tools/build_file_source.py --output file-source/public
          cd file-source
          git config user.name "AniCAT releases"
          git config user.email "actions@users.noreply.github.com"
          git add public/
          if ! git diff --cached --quiet; then
            git commit -m "Update Kodi repository installer"
            git push origin HEAD:main
          fi
